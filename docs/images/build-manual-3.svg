<svg aria-label="One output in detail: terminal block, three amp fuse, four-core cable with capped spare, strip input pads with the backup-input jumper, the 135-pixel run, and the injection pair returning to the far end" height="500" style="color:#e9eef5;font-family:Roboto,Arial,sans-serif" viewbox="0 0 1180 500" width="1180" xmlns="http://www.w3.org/2000/svg"><rect fill="#0a0b10" height="500.0" width="1180.0" x="0.0" y="0.0"></rect>
