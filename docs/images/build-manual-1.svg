<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="Diagram: the controller sends 540 packets of 24 bits down one wire; each pixel keeps the first packet and forwards the rest" height="132" style="color:#e9eef5;font-family:Roboto,Arial,sans-serif" viewbox="0 0 800 132" width="800" xmlns="http://www.w3.org/2000/svg"><rect fill="#0a0b10" height="132.0" width="800.0" x="0.0" y="0.0"></rect>
<rect fill="#1a1d27" height="52" rx="7" stroke="rgba(233,238,245,.22)" width="126" x="4" y="40"></rect>
<text fill="#e9eef5" font-family="Roboto, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" x="67" y="63">Dig-Quad</text>
<text fill="rgba(233,238,245,.45)" font-family="Roboto Mono, monospace" font-size="10" text-anchor="middle" x="67" y="80">one data pin</text>
<line stroke="#4ec26b" stroke-width="2" x1="130" x2="196" y1="66" y2="66"></line>
<text fill="#4ec26b" font-family="Roboto Mono, monospace" font-size="9.5" text-anchor="middle" x="163" y="34">540 packets</text>
<text fill="rgba(233,238,245,.4)" font-family="Roboto Mono, monospace" font-size="9" text-anchor="middle" x="163" y="102">one wire</text>
<g font-family="Roboto Mono, monospace" font-size="10">
<rect fill="#13151d" height="44" rx="5" stroke="rgba(233,238,245,.2)" width="86" x="198" y="44"></rect>
<text fill="#e9eef5" font-size="10.5" font-weight="600" text-anchor="middle" x="241" y="61">pixel 1</text>
<text fill="#45d7e0" text-anchor="middle" x="241" y="77">keeps 24</text>
<line stroke="#4ec26b" stroke-width="2" x1="284" x2="316" y1="66" y2="66"></line>
<text fill="rgba(233,238,245,.45)" font-size="9" text-anchor="middle" x="300" y="56">539</text>
<rect fill="#13151d" height="44" rx="5" stroke="rgba(233,238,245,.2)" width="86" x="318" y="44"></rect>
<text fill="#e9eef5" font-size="10.5" font-weight="600" text-anchor="middle" x="361" y="61">pixel 2</text>
<text fill="#45d7e0" text-anchor="middle" x="361" y="77">keeps 24</text>
<line stroke="#4ec26b" stroke-width="2" x1="404" x2="436" y1="66" y2="66"></line>
<text fill="rgba(233,238,245,.45)" font-size="9" text-anchor="middle" x="420" y="56">538</text>
<rect fill="#13151d" height="44" rx="5" stroke="rgba(233,238,245,.2)" width="86" x="438" y="44"></rect>
<text fill="#e9eef5" font-size="10.5" font-weight="600" text-anchor="middle" x="481" y="61">pixel 3</text>
<text fill="#45d7e0" text-anchor="middle" x="481" y="77">keeps 24</text>
<line stroke="#4ec26b" stroke-dasharray="4 4" stroke-width="2" x1="524" x2="556" y1="66" y2="66"></line>
<text fill="rgba(233,238,245,.42)" font-size="13" x="576" y="70">· · ·</text>
<line stroke="#4ec26b" stroke-dasharray="4 4" stroke-width="2" x1="600" x2="632" y1="66" y2="66"></line>
<rect fill="#13151d" height="44" rx="5" stroke="rgba(233,238,245,.2)" width="98" x="634" y="44"></rect>
<text fill="#e9eef5" font-size="10.5" font-weight="600" text-anchor="middle" x="683" y="61">pixel 540</text>
<text fill="#45d7e0" text-anchor="middle" x="683" y="77">keeps 24</text>
</g>
<text fill="rgba(233,238,245,.42)" font-family="Roboto, sans-serif" font-size="11.5" text-anchor="middle" x="400" y="118">Nothing addresses a pixel. Position in the queue <tspan font-style="italic">is</tspan> the address.</text>
</svg>
